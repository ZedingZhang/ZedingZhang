name: Update open source contributions

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with open source contributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update open source contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ZedingZhang
        run: node .github/scripts/update-recent-activity.mjs

      - name: Commit updated contributions
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Open source contributions are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update open source contributions"
          git push
