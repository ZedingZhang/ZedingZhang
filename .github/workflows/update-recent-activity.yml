name: Update recent activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with recent activity
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ZedingZhang
          MAX_LINES: "20"
          FILTER_EVENTS: IssuesEvent,PullRequestEvent,ReleaseEvent
          EXCLUDED_REPOS: ZedingZhang/github-workflow-lab
        run: node .github/scripts/update-recent-activity.mjs

      - name: Commit updated activity
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Recent activity is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent GitHub activity"
          git push
