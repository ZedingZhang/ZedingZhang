<svg xmlns="http://www.w3.org/2000/svg" width="880" height="38" viewBox="0 0 880 38" fill="none" role="img" aria-label="adobe/react-spectrum: 1 merged PRs, 16.1k★">
  <defs>
    <linearGradient id="prBarGrad-light" x1="0" y1="0" x2="-210" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#446688"/>
      <stop offset="100%" stop-color="#7193B5"/>
    </linearGradient>
    <linearGradient id="starBarGrad-light" x1="0" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
