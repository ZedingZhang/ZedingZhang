<svg xmlns="http://www.w3.org/2000/svg" width="880" height="38" viewBox="0 0 880 38" fill="none" role="img" aria-label="alibaba/MNN: 6 merged PRs, 16.6k★">
  <defs>
    <linearGradient id="prBarGrad-light" x1="0" y1="0" x2="-235" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#446688"/>
      <stop offset="100%" stop-color="#7193B5"/>
    </linearGradient>
    <linearGradient id="starBarGrad-light" x1="0" y1="0" x2="235" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F7977"/>
      <stop offset="100%" stop-color="#7FA4A0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes barGrow {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }
    @keyframes valueFadeLeft {
      from {
        opacity: 0;
        transform: translateX(6px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes valueFadeRight {
      from {
        opacity: 0;
        transform: translateX(-6px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .bar {
      transform-origin: 0 0;
      transform: scaleX(0);
      animation: barGrow 1400ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .bar-value-left {
      opacity: 0;
      animation: valueFadeLeft 1200ms ease-out both;
    }
    .bar-value-right {
      opacity: 0;
      animation: valueFadeRight 1200ms ease-out both;
    }
  </style>
