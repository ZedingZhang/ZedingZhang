  <line x1="726.40" y1="0" x2="726.40" y2="28" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3.5 3.5" stroke-opacity="0.6"/>
  <line x1="836.00" y1="0" x2="836.00" y2="28" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3.5 3.5" stroke-opacity="0.6"/>
  <line x1="288" y1="0" x2="288" y2="28" stroke="#D0D7DE" stroke-width="1"/>
  <text x="210" y="18.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"><tspan fill="#656D76" font-weight="400">ayuayue/</tspan><tspan fill="#1F2328" font-weight="600">PiDeck</tspan></text>
  <text x="276" y="18.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500"><tspan fill="#57606A">1.2k</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#BF8700" dx="1.5">&#9733;</tspan></text>
  <g transform="translate(288, 6)">
