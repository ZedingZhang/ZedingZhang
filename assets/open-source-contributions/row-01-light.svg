<svg xmlns="http://www.w3.org/2000/svg" width="880" height="28" viewBox="0 0 880 28" fill="none" role="img" aria-label="ayuayue/PiDeck: 10 merged PRs (1.2k★)">
  <defs>
    <linearGradient id="barGrad-light" x1="0" y1="0" x2="548" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="100%" stop-color="#218BFF"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes barGrow {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }
    @keyframes valueFade {
      from {
        opacity: 0;
        transform: translateX(-6px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .bar {
      transform-origin: 0 0;
      transform: scaleX(0);
      animation: barGrow 1400ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .bar-value {
      opacity: 0;
      animation: valueFade 1200ms ease-out both;
    }
  </style>
