        opacity: 0;
        transform: translateX(-6px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .bar {
      transform-origin: 0 0;
      transform: scaleX(0);
      animation: barGrow 1400ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .bar-value-left {
      opacity: 0;
      animation: valueFadeLeft 1200ms ease-out both;
    }
